name: Build installer

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          lfs: true

      - name: Verify packaged binary dependencies
        shell: pwsh
        run: |
          $binaryFiles = Get-ChildItem "IstripperQuickPlayer\dependencies" -File |
            Where-Object { $_.Extension -in ".dll", ".exe" }
          if (-not $binaryFiles) {
            throw "No packaged binary dependencies were found."
          }
          foreach ($file in $binaryFiles) {
            $stream = [System.IO.File]::OpenRead($file.FullName)
            try {
              if ($stream.Length -lt 2 -or $stream.ReadByte() -ne 0x4d -or $stream.ReadByte() -ne 0x5a) {
                throw "$($file.Name) is not a Windows PE file. Git LFS content may be missing."
              }
            } finally {
              $stream.Dispose()
            }
          }
          Write-Host "Verified $($binaryFiles.Count) packaged PE dependencies."

      - name: Verify local development versioning
        shell: pwsh
        run: |
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP "version-test"
          $first = & .\tools\Get-LocalBuildVersion.ps1 -RepositoryRoot .
          $second = & .\tools\Get-LocalBuildVersion.ps1 -RepositoryRoot .
          if ([version]($second -replace "-dev$", "") -le [version]($first -replace "-dev$", "")) {
            throw "Local build version did not increase: $first -> $second"
          }

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Set package version
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq "tag") {
            $env:GITHUB_REF_NAME -replace '^v', ''
          } else {
            "0.36.$env:GITHUB_RUN_NUMBER"
          }
          "APP_VERSION=$version" >> $env:GITHUB_ENV

      - name: Restore application dependencies
        shell: pwsh
        run: |
          $project = "IstripperQuickPlayer\IstripperQuickPlayer.csproj"
          dotnet restore $project --runtime win-x64
          if ($LASTEXITCODE) {
            exit $LASTEXITCODE
          }

      - name: Build native bridges
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -products * `
            -find MSBuild\**\Bin\MSBuild.exe | Select-Object -First 1
          if (-not $msbuild) {
            throw "MSBuild was not found."
          }
          & $msbuild native\IStripperPlaybackBridge64\IStripperPlaybackBridge64.vcxproj `
            /p:Configuration=Release /p:Platform=x64 /m
          if ($LASTEXITCODE) {
            exit $LASTEXITCODE
          }
          $nugetRoot = if ($env:NUGET_PACKAGES) {
            $env:NUGET_PACKAGES
          } else {
            Join-Path $env:USERPROFILE ".nuget\packages"
          }
          $nugetRoot = [System.IO.Path]::GetFullPath($nugetRoot).TrimEnd('\') + '\'
          & $msbuild native\IStripperRvmGpuBridge64\IStripperRvmGpuBridge64.vcxproj `
            /p:Configuration=Release /p:Platform=x64 `
            "/p:NuGetPackageRoot=$nugetRoot" /m
          if ($LASTEXITCODE) {
            exit $LASTEXITCODE
          }
          $rvmBridge = "IstripperQuickPlayer\dependencies\IStripperRvmGpuBridge64.dll"
          if (-not (Test-Path $rvmBridge)) {
            throw "The native RVM GPU bridge was not produced."
          }

      - name: Publish self-contained application
        shell: pwsh
        run: |
          $project = "IstripperQuickPlayer\IstripperQuickPlayer.csproj"
          $publishDir = "$env:GITHUB_WORKSPACE\artifacts\publish"
          dotnet publish $project --configuration Release --runtime win-x64 `
            --self-contained true --no-restore --output $publishDir `
            -p:Version=$env:APP_VERSION -p:DebugType=None -p:DebugSymbols=false
          if ($LASTEXITCODE) {
            exit $LASTEXITCODE
          }
          Copy-Item "IstripperQuickPlayer\dependencies\*" $publishDir -Force

      - name: Publish shader video streamer example
        shell: pwsh
        run: |
          $project = "tools\ShaderVideoStreamer\ShaderVideoStreamer.csproj"
          $publishDir = "$env:GITHUB_WORKSPACE\artifacts\publish\ShaderVideoStreamer"
          dotnet restore $project --runtime win-x64
          if ($LASTEXITCODE) {
            exit $LASTEXITCODE
          }
          dotnet publish $project --configuration Release --runtime win-x64 `
            --self-contained true --no-restore --output $publishDir `
            -p:Version=$env:APP_VERSION -p:DebugType=None -p:DebugSymbols=false
          if ($LASTEXITCODE) {
            exit $LASTEXITCODE
          }
          if (-not (Test-Path "$publishDir\ShaderVideoStreamer.exe")) {
            throw "ShaderVideoStreamer.exe was not published."
          }
          & "$publishDir\ShaderVideoStreamer.exe" --help
          if ($LASTEXITCODE) {
            exit $LASTEXITCODE
          }

      - name: Deduplicate shader video streamer runtime
        shell: pwsh
        run: |
          .\tools\Prepare-ShaderVideoStreamerPackage.ps1 `
            -MainPublishDirectory "$env:GITHUB_WORKSPACE\artifacts\publish" `
            -PlayerPublishDirectory "$env:GITHUB_WORKSPACE\artifacts\publish\ShaderVideoStreamer"

      - name: Smoke-test WinForms controls
        shell: pwsh
        run: |
          $actualVersion = (Get-Item `
            "$env:GITHUB_WORKSPACE\artifacts\publish\IStripperQuickPlayer.exe").VersionInfo.ProductVersion.Split("+")[0]
          if ($actualVersion -ne $env:APP_VERSION) {
            throw "Published version '$actualVersion' does not match '$env:APP_VERSION'."
          }
          $process = Start-Process `
            "$env:GITHUB_WORKSPACE\artifacts\publish\IStripperQuickPlayer.exe" `
            -ArgumentList "--verify-controls" -Wait -PassThru
          if ($process.ExitCode) {
            exit $process.ExitCode
          }

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          & $iscc installer\IStripperQuickPlayer.iss `
            "/DAppVersion=$env:APP_VERSION" `
            "/DSourceDir=$env:GITHUB_WORKSPACE\artifacts\publish" `
            "/DSceneSourceDir=$env:GITHUB_WORKSPACE\scenes\Midnight Gallery Club" `
            "/DOutputDir=$env:GITHUB_WORKSPACE\artifacts\installer"
          if ($LASTEXITCODE) {
            exit $LASTEXITCODE
          }

      - uses: actions/upload-artifact@v7
        with:
          name: installer
          path: artifacts/installer/*.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write

    steps:
      - uses: actions/download-artifact@v8
        with:
          name: installer
          path: release

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release/*.exe --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$GITHUB_REF_NAME" release/*.exe --verify-tag --generate-notes --repo "$GITHUB_REPOSITORY"
          fi
